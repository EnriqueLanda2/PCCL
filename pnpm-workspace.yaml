packages:
  - 'apps/backend'
  - 'apps/frontend/web-shell'
  - 'packages/*'
  # Pipeline de avatares: es un paquete propio para que los scripts de
  # `tools/avatar-pipeline` resuelvan @gltf-transform y meshoptimizer desde su
  # propia ubicación (Node resuelve por la ruta del archivo, no por el cwd).
  - 'tools/avatar-pipeline'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@react-three/drei@10.7.8'
