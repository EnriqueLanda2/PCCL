services:

  # ─── Message broker ───────────────────────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    ports:
      - '4222:4222'
    restart: unless-stopped

  # ─── Databases (one per service) ──────────────────────────────────────────────
  postgres-identity:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata-identity:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-learning:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: learning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata-learning:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-certification:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: certification
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata-certification:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-payment:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata-payment:/var/lib/postgresql/data
    restart: unless-stopped

  # ─── Microservices ────────────────────────────────────────────────────────────
  identity-service:
    build:
      context: ../../../apps/backend
      dockerfile: ../../infra/docker/images/services/Dockerfile.identity
    environment:
      NATS_URL: nats://nats:4222
      IDENTITY_DATABASE_URL: postgresql://postgres:postgres@postgres-identity:5432/identity
      JWT_SECRET: ${JWT_SECRET:-pccl_secret_change_in_prod}
      JWT_EXPIRES_IN: 1d
      NODE_ENV: ${NODE_ENV:-development}
      # Notificaciones push — opcional, sin esto simplemente no se mandan.
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
    depends_on:
      - nats
      - postgres-identity
    restart: unless-stopped

  learning-service:
    build:
      context: ../../../apps/backend
      dockerfile: ../../infra/docker/images/services/Dockerfile.learning
    environment:
      NATS_URL: nats://nats:4222
      LEARNING_DATABASE_URL: postgresql://postgres:postgres@postgres-learning:5432/learning
      IDENTITY_DATABASE_URL: postgresql://postgres:postgres@postgres-identity:5432/identity
      NODE_ENV: ${NODE_ENV:-development}
      # Chatbot AIRumbo — opcional, sin esto los mensajes fallan pero nada más se rompe.
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_BASIC_AUTH_USERNAME: ${OLLAMA_BASIC_AUTH_USERNAME:-}
      OLLAMA_BASIC_AUTH_PASSWORD: ${OLLAMA_BASIC_AUTH_PASSWORD:-}
    depends_on:
      - nats
      - postgres-learning
      - identity-service
    restart: unless-stopped

  certification-service:
    build:
      context: ../../../apps/backend
      dockerfile: ../../infra/docker/images/services/Dockerfile.certification
    environment:
      NATS_URL: nats://nats:4222
      CERTIFICATION_DATABASE_URL: postgresql://postgres:postgres@postgres-certification:5432/certification
      NODE_ENV: ${NODE_ENV:-development}
      # El PDF del certificado se sube a S3 — sin esto, la emisión falla.
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      - nats
      - postgres-certification
      - learning-service
    restart: unless-stopped

  payment-service:
    build:
      context: ../../../apps/backend
      dockerfile: ../../infra/docker/images/services/Dockerfile.payment
    environment:
      NATS_URL: nats://nats:4222
      PAYMENT_DATABASE_URL: postgresql://postgres:postgres@postgres-payment:5432/payment
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      - nats
      - postgres-payment
      - learning-service
    restart: unless-stopped

  gateway:
    build:
      context: ../../../apps/backend
      dockerfile: ../../infra/docker/images/services/Dockerfile.gateway
    # Sin publicar puerto al host a propósito: solo caddy lo alcanza, por la
    # red interna de compose (nombre de servicio = hostname). Todo lo público
    # entra por caddy en 80/443.
    environment:
      PORT: 3010
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:-pccl_secret_change_in_prod}
      JWT_EXPIRES_IN: 1d
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3002}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      NODE_ENV: ${NODE_ENV:-development}
      # Subida de portadas/documentos/videos — sin esto, /uploads/* falla.
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Moderador de las clases en vivo por Jitsi — opcional, sin esto cae al
      # meet.jit.si público y cualquiera puede "reclamar" moderador a mano.
      JAAS_APP_ID: ${JAAS_APP_ID:-}
      JAAS_API_KEY_ID: ${JAAS_API_KEY_ID:-}
      JAAS_PRIVATE_KEY: ${JAAS_PRIVATE_KEY:-}
    depends_on:
      - nats
      - identity-service
      - learning-service
      - certification-service
      - payment-service
    restart: unless-stopped

  frontend:
    build:
      context: ../../..
      dockerfile: infra/docker/images/services/Dockerfile.frontend
      args:
        # Se hornea en el bundle del cliente en build time — por eso viaja
        # como build arg y no como variable de entorno normal del servicio.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3010}
    restart: unless-stopped

  # ─── Reverse proxy + HTTPS automático ─────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gateway
      - frontend
    restart: unless-stopped

volumes:
  pgdata-identity:
  pgdata-learning:
  pgdata-certification:
  pgdata-payment:
  caddy-data:
  caddy-config:
