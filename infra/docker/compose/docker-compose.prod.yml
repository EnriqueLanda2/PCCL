services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - gateway
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
    restart: unless-stopped

  identity-service:
    build:
      context: ../../../apps/backend
      dockerfile: ../../infra/docker/images/services/Dockerfile.identity
    env_file:
      - ../../../apps/backend/.env.production
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      - nats
    restart: unless-stopped

  learning-service:
    build:
      context: ../../../apps/backend
      dockerfile: ../../infra/docker/images/services/Dockerfile.learning
    env_file:
      - ../../../apps/backend/.env.production
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      - nats
      - identity-service
    restart: unless-stopped

  certification-service:
    build:
      context: ../../../apps/backend
      dockerfile: ../../infra/docker/images/services/Dockerfile.certification
    env_file:
      - ../../../apps/backend/.env.production
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      - nats
      - learning-service
    restart: unless-stopped

  payment-service:
    build:
      context: ../../../apps/backend
      dockerfile: ../../infra/docker/images/services/Dockerfile.payment
    env_file:
      - ../../../apps/backend/.env.production
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      - nats
      - learning-service
    restart: unless-stopped

  gateway:
    build:
      context: ../../../apps/backend
      dockerfile: ../../infra/docker/images/services/Dockerfile.gateway
    env_file:
      - ../../../apps/backend/.env.production
    environment:
      NATS_URL: nats://nats:4222
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "3010:3010"
    volumes:
      - gateway-uploads:/app/storage/uploads
    depends_on:
      - nats
      - identity-service
      - learning-service
      - certification-service
      - payment-service
    restart: unless-stopped

  frontend:
    build:
      context: ../../..
      dockerfile: infra/docker/images/services/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost/api}
        NEXT_PUBLIC_JITSI_DOMAIN: ${NEXT_PUBLIC_JITSI_DOMAIN:-meet.jit.si}
        NEXT_PUBLIC_RPM_SUBDOMAIN: ${NEXT_PUBLIC_RPM_SUBDOMAIN:-disabled}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-disabled}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY:-}
    ports:
      - "3002:3002"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  gateway-uploads:
